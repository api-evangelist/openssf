apis:
- aid: openssf:sigstore-api
  name: Sigstore Public Good APIs
  description: >-
    Sigstore is an OpenSSF-hosted standard and service for signing, verifying, and protecting software.
    The public-good Sigstore instance exposes Fulcio (code-signing certificate authority) and Rekor (transparency
    log) APIs that can be queried programmatically to inspect signing certificates and transparency log
    entries.
  humanURL: https://www.sigstore.dev/
  baseURL: https://rekor.sigstore.dev
  tags:
  - Signing
  - Transparency Log
  - Supply Chain
  properties:
  - type: Documentation
    url: https://docs.sigstore.dev/
  - type: Documentation
    url: https://docs.sigstore.dev/logging/overview/
  - type: GitHubOrganization
    url: https://github.com/sigstore
- aid: openssf:guac-api
  name: GUAC (Graph for Understanding Artifact Composition)
  description: >-
    GUAC aggregates software supply-chain security metadata (SBOMs, attestations, vulnerabilities, signatures)
    into a queryable graph. GUAC exposes a GraphQL API for supply-chain queries when self-hosted.
  humanURL: https://guac.sh/
  baseURL: https://guac.sh
  tags:
  - SBOM
  - Supply Chain
  - GraphQL
  properties:
  - type: Documentation
    url: https://docs.guac.sh/
  - type: GitHubRepository
    url: https://github.com/guacsec/guac
  - url: graphql/openssf-graphql.md
    type: GraphQL
