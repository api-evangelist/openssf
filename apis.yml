aid: openssf
name: OpenSSF
description: >-
  The Open Source Security Foundation (OpenSSF) is a collaborative initiative under the Linux Foundation dedicated to
  improving the security of open source software. It brings together industry leaders, developers, and security experts
  to address vulnerabilities, enhance supply chain security, and develop security tools and best practices. OpenSSF
  stewards a number of projects with public REST APIs, including the OSV (Open Source Vulnerabilities) database, the
  Scorecard automated security health-check service, and Sigstore signing infrastructure.
